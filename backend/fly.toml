# Fly.io deployment. See ADR-0005 for why Fly rather than Render or Vercel.
app = "sf-on-film-api"
primary_region = "sjc"  # Close to both the data and its likely audience.

[build]
  dockerfile = "Dockerfile"

[env]
  DJANGO_DEBUG = "false"
  # Persistent volume, not the container filesystem — this is the whole reason
  # SQLite is viable in production here.
  DATABASE_PATH = "/data/db.sqlite3"

[[mounts]]
  source = "sf_film_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # No scale-to-zero: a cold start is the first thing a reviewer would meet.
  auto_stop_machines = false
  min_machines_running = 1

  [http_service.http_options.response.headers]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[checks.health]
  type = "http"
  path = "/api/health/"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
